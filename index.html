<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>AIジャンケンロボット</title>
  <style>
    body { 
      text-align: center; 
      font-family: sans-serif; 
      background: #f5f5f5;
      padding-top: 40px;
    }
    .hand { 
      font-size: 80px; 
      margin: 20px;
    }
    button {
      font-size: 20px;
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
    }
    #score {
      margin-top: 30px;
      font-size: 22px;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <h1>AIジャンケンロボット</h1>

  <div id="robot" class="hand">🤖</div>
  <p id="result"></p>

  <button onclick="play('グー')">✊ グー</button>
  <button onclick="play('チョキ')">✌ チョキ</button>
  <button onclick="play('パー')">🖐 パー</button>

  <div id="score"></div>

  <button onclick="resetScore()" style="margin-top:20px; background:#ff6666; color:white;">
    リセット
  </button>

  <script>
    // 履歴（AI学習用）
    let history = JSON.parse(localStorage.getItem('jankenHistory')) || {
      'グー': 0,
      'チョキ': 0,
      'パー': 0
    };

    // スコア（累計）
    let score = JSON.parse(localStorage.getItem('jankenScore')) || {
      win: 0,
      lose: 0,
      draw: 0
    };

    // スコア表示更新
    function updateScoreDisplay() {
      document.getElementById('score').innerHTML = `
        🔵 あなたの勝ち：${score.win}<br>
        🔴 ロボットの勝ち：${score.lose}<br>
        ⚪ あいこ：${score.draw}
      `;
    }

    updateScoreDisplay();

    function getAIHand() {
      const entries = Object.entries(history);

      // 全部0ならランダム
      if (entries.every(([_, count]) => count === 0)) {
        const hands = ['グー', 'チョキ', 'パー'];
        return hands[Math.floor(Math.random() * 3)];
      }

      // 最も多く出された手を分析
      entries.sort((a, b) => b[1] - a[1]);
      const mostUsed = entries[0][0];

      // その手に勝てる手
      const counter = {
        'グー': 'パー',
        'チョキ': 'グー',
        'パー': 'チョキ'
      };

      // 80%は学習、20%はランダム
      if (Math.random() < 0.8) {
        return counter[mostUsed];
      } else {
        const hands = ['グー', 'チョキ', 'パー'];
        return hands[Math.floor(Math.random() * 3)];
      }
    }

    function play(userHand) {
      // 履歴を更新
      history[userHand]++;
      localStorage.setItem('jankenHistory', JSON.stringify(history));

      const robotHand = getAIHand();

      let result = '';
      if (userHand === robotHand) {
        result = 'あいこ';
        score.draw++;
      } else if (
        (userHand === 'グー' && robotHand === 'チョキ') ||
        (userHand === 'チョキ' && robotHand === 'パー') ||
        (userHand === 'パー' && robotHand === 'グー')
      ) {
        result = 'あなたの勝ち';
        score.win++;
      } else {
        result = 'ロボットの勝ち';
        score.lose++;
      }

      // スコア保存
      localStorage.setItem('jankenScore', JSON.stringify(score));

      // 表示更新
      document.getElementById('robot').textContent = robotHand;
      document.getElementById('result').textContent = result;
      updateScoreDisplay();
    }

    // スコアリセット
    function resetScore() {
      score = { win: 0, lose: 0, draw: 0 };
      localStorage.setItem('jankenScore', JSON.stringify(score));
      updateScoreDisplay();
      alert("スコアをリセットしました");
    }
  </script>
</body>
</html>
