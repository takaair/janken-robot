<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>AIジャンケンロボット｜学習するジャンケンゲーム・勝敗記録つき</title>
  <meta name="description" content="AIがあなたの癖を学習して対戦するジャンケンロボット。手を隠す演出、勝敗の累計表示、学習機能つきのブラウザゲームです。無料で遊べます。">
  <style>
    body { 
      text-align: center; 
      font-family: sans-serif; 
      background: #f5f5f5;
      padding-top: 40px;
    }
    .hand { 
      font-size: 80px; 
      margin: 20px;
      transition: 0.2s;
    }
    button {
      font-size: 20px;
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
    }
    table {
      margin: 30px auto;
      border-collapse: collapse;
      width: 300px;
      background: white;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      font-size: 20px;
    }
    th {
      background: #e0e0e0;
    }
  </style>
</head>
<body>
  <h1>AIジャンケンロボット</h1>

  <div id="robot" class="hand">🤖</div>
  <p id="result"></p>

  <button onclick="play('グー')">✊ グー</button>
  <button onclick="play('チョキ')">✌ チョキ</button>
  <button onclick="play('パー')">🖐 パー</button>

  <table>
    <tr><th>結果</th><th>回数</th></tr>
    <tr><td>あなたの勝ち</td><td id="win">0</td></tr>
    <tr><td>ロボットの勝ち</td><td id="lose">0</td></tr>
    <tr><td>あいこ</td><td id="draw">0</td></tr>
  </table>

  <button onclick="resetScore()" style="margin-top:20px; background:#ff6666; color:white;">
    リセット
  </button>

  <script>
    // 履歴（AI学習用）
    let history = JSON.parse(localStorage.getItem('jankenHistory')) || {
      'グー': 0,
      'チョキ': 0,
      'パー': 0
    };

    // スコア（累計）
    let score = JSON.parse(localStorage.getItem('jankenScore')) || {
      win: 0,
      lose: 0,
      draw: 0
    };

    // 絵文字変換
    const emoji = {
      'グー': '✊',
      'チョキ': '✌',
      'パー': '🖐'
    };

    // 表示更新
    function updateScoreDisplay() {
      document.getElementById('win').textContent = score.win;
      document.getElementById('lose').textContent = score.lose;
      document.getElementById('draw').textContent = score.draw;
    }

    updateScoreDisplay();

    function getAIHand() {
      const entries = Object.entries(history);

      // 全部0ならランダム
      if (entries.every(([_, count]) => count === 0)) {
        const hands = ['グー', 'チョキ', 'パー'];
        return hands[Math.floor(Math.random() * 3)];
      }

      // 最も多く出された手を分析
      entries.sort((a, b) => b[1] - a[1]);
      const mostUsed = entries[0][0];

      // その手に勝てる手
      const counter = {
        'グー': 'パー',
        'チョキ': 'グー',
        'パー': 'チョキ'
      };

      // 80%は学習、20%はランダム
      if (Math.random() < 0.8) {
        return counter[mostUsed];
      } else {
        const hands = ['グー', 'チョキ', 'パー'];
        return hands[Math.floor(Math.random() * 3)];
      }
    }

    function play(userHand) {
      // 履歴を更新
      history[userHand]++;
      localStorage.setItem('jankenHistory', JSON.stringify(history));

      // ロボットの手を先に決める（重要）
      const robotHand = getAIHand();

      // 一旦隠す
      document.getElementById('robot').textContent = "❓";
      document.getElementById('result').textContent = "";

      // 0.8秒後に表示
      setTimeout(() => {
        let result = '';
        if (userHand === robotHand) {
          result = 'あいこ';
          score.draw++;
        } else if (
          (userHand === 'グー' && robotHand === 'チョキ') ||
          (userHand === 'チョキ' && robotHand === 'パー') ||
          (userHand === 'パー' && robotHand === 'グー')
        ) {
          result = 'あなたの勝ち';
          score.win++;
        } else {
          result = 'ロボットの勝ち';
          score.lose++;
        }

        // スコア保存
        localStorage.setItem('jankenScore', JSON.stringify(score));

        // 絵文字で表示
        document.getElementById('robot').textContent = emoji[robotHand];
        document.getElementById('result').textContent = result;
        updateScoreDisplay();
      }, 800);
    }

    // スコアリセット
    function resetScore() {
      score = { win: 0, lose: 0, draw: 0 };
      localStorage.setItem('jankenScore', JSON.stringify(score));
      updateScoreDisplay();
      alert("スコアをリセットしました");
    }
  </script>
</body>
</html>
